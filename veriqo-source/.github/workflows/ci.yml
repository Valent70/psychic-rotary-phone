name: Veriqo CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  GO_VERSION: "1.25"

jobs:
  # ── Quality Gate ───────────────────────────────────────────────────────────
  lint:
    name: Lint & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: .
          args: --timeout=5m

  # ── Security ───────────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -fmt=sarif -out=gosec.sarif ./... || true
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: gosec.sarif }

  # ── Tests ──────────────────────────────────────────────────────────────────
  test:
    name: Test (race + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      - name: Unit + Race
        run: go test -race -count=1 -timeout=180s -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage report
        run: go tool cover -func=coverage.out | tail -1
      - name: Enforce >85% coverage
        run: |
          PCT=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          if (( $(echo "$PCT < 85" | bc -l) )); then
            echo "Coverage $PCT% is below 85% threshold"; exit 1;
          fi
      - uses: codecov/codecov-action@v4
        with: { files: coverage.out }

  # ── Fuzz (short run in CI) ─────────────────────────────────────────────────
  fuzz:
    name: Fuzz (short)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      - run: go test -fuzz=FuzzWALRoundtrip   -fuzztime=30s ./pkg/storage/wal/...
      - run: go test -fuzz=FuzzEvidenceAppend -fuzztime=30s ./pkg/storage/evidence/...
      - run: go test -fuzz=FuzzPolicyEval     -fuzztime=30s ./pkg/security/policy/...

  # ── Benchmark ─────────────────────────────────────────────────────────────
  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      - run: go test -bench=. -benchmem -run='^$$' ./... | tee bench.txt
      - uses: actions/upload-artifact@v4
        with: { name: bench-results, path: bench.txt }

  # ── SBOM ──────────────────────────────────────────────────────────────────
  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      - name: Generate SBOM (CycloneDX)
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest
          cyclonedx-gomod app -output bom.cdx.xml -licenses -json ./cmd/veriqod
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: bom.cdx.xml }

  # ── Build ──────────────────────────────────────────────────────────────────
  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      - name: Build veriqod
        run: go build -trimpath -o bin/veriqod ./cmd/veriqod
      - name: Build veriqoctl
        run: go build -trimpath -o bin/veriqoctl ./cmd/veriqoctl
      - uses: actions/upload-artifact@v4
        with: { name: binaries, path: bin/ }

name: chaos
on:
  schedule: [{ cron: '0 4 * * 0' }]
  workflow_dispatch: {}
jobs:
  chaos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: 'stable' }
      - name: concurrency acceptance under race
        run: go test -race -run TestAcceptance9 ./test/acceptance/
      - name: consensus repeat under race
        run: go test -race -count=5 ./pkg/consensus/...

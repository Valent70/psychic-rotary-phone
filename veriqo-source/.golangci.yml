run:
  timeout: 5m
  go: "1.25"
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
    - unparam
    - gocritic
    - exhaustive
    - noctx
    - bodyclose
    - contextcheck
    - cyclop
    - funlen
    - godot
    - gocognit
    - nestif
    - prealloc
    - revive
    - whitespace
    - wsl

linters-settings:
  cyclop:
    max-complexity: 15
  funlen:
    lines: 100
    statements: 60
  gocognit:
    min-complexity: 20
  revive:
    rules:
      - name: exported
      - name: var-naming
      - name: error-return
      - name: error-strings
      - name: error-naming

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - funlen
        - cyclop
        - gocognit
  max-issues-per-linter: 50
  max-same-issues: 5

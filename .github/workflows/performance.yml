name: performance
on:
  schedule: [{ cron: '0 5 * * 1' }]
  workflow_dispatch: {}
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: 'stable' }
      - name: benchmarks
        # Single-process benchmarks are a REGRESSION signal only. PHASE 40
        # scale qualification (100 nodes / 1M evidence) is a separate,
        # infrastructure-backed gate and stays BLOCKED until it is run.
        run: go test -bench=. -benchtime=100x -run '^$' ./... | tee bench.txt
      - uses: actions/upload-artifact@v4
        with: { name: benchmarks, path: bench.txt }

name: verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: 'stable' }
      - name: format
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: unit
        run: go test ./...
      - name: race
        run: go test -race -p 1 ./...
      - name: acceptance
        run: go test ./test/acceptance/
      - name: acceptance-governance
        # PHASE 34: the permanent suite may only ever grow. This step
        # fails if a category shrinks or a mandatory test is deleted.
        run: go run ./cmd/veriqo-readiness --skip-race --out /tmp/readiness.json || true
      - uses: actions/upload-artifact@v4
        with: { name: readiness, path: /tmp/readiness.json }
